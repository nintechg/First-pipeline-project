<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Velour Streetwear</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #000;
      color: #fff;
      line-height: 1.6;
    }

    header {
      background: #1a1a1a;
      padding: 20px 50px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      color: darkred;
      font-size: 28px;
      letter-spacing: 2px;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 20px;
      font-size: 16px;
    }

    nav a:hover {
      color: darkred;
    }

    .hero {
      height: 90vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      background: linear-gradient(rgba(0,0,0,0.7), rgba(139,0,0,0.5));
    }

    .hero h2 {
      font-size: 60px;
      text-transform: uppercase;
    }

    .hero p {
      margin-top: 10px;
      font-size: 20px;
      color: #ddd;
    }

    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 25px;
      background: darkred;
      color: white;
      text-decoration: none;
      border-radius: 5px;
    }

    .products {
      padding: 50px;
      text-align: center;
    }

    .products h2 {
      color: darkred;
      margin-bottom: 30px;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .product-card {
      background: #111;
      padding: 20px;
      border: 1px solid darkred;
      border-radius: 10px;
    }

    .product-card img {
      width: 100%;
      border-radius: 10px;
    }

    footer {
      background: #1a1a1a;
      text-align: center;
      padding: 20px;
      margin-top: 40px;
      color: #aaa;
    }
  </style>
</head>
<body>

  <header>
    <h1>VELOUR</h1>
    <nav>
      <a href="#">Home</a>
      <a href="#products">Shop</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <section class="hero">
    <div>
      <h2>Lotanna Luxury Streetwear</h2>
      <p>Bold fashion in black, white, and dark red.</p>
      <a href="#products" class="btn">Shop Now</a>
    </div>
  </section>

  <section class="products" id="products">
    <h2>Featured Collection</h2>
    <div class="product-grid">
      <div class="product-card">
        <img src="https://via.placeholder.com/300x400" alt="Hoodie">
        <h3>Black Hoodie</h3>
        <p>$59.99</p>
      </div>

      <div class="product-card">
        <img src="https://via.placeholder.com/300x400" alt="T-Shirt">
        <h3>White Tee</h3>
        <p>$39.99</p>
      </div>

      <div class="product-card">
        <img src="https://via.placeholder.com/300x400" alt="Jacket">
        <h3>Dark Red Jacket</h3>
        <p>$89.99</p>
      </div>
    </div>
  </section>

  <footer>
    <p>© 2026 Velour Clothing Brand | Designed in Black, White & Dark Red</p>
  </footer>

</body>
</html>
